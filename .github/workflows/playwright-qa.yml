name: Playwright TypeScript QA

on:
  push:
    branches: [main]
    paths:
      - 'playwright-typescript-qa/**'
      - '.github/workflows/playwright-qa.yml'
  pull_request:
    paths:
      - 'playwright-typescript-qa/**'
      - '.github/workflows/playwright-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: UI + API tests (Chromium and Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: playwright-typescript-qa
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check TypeScript
        run: npm run typecheck
      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium firefox
      - name: Run Playwright suite
        run: npm test
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-typescript-qa/playwright-report/
          retention-days: 14
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: playwright-typescript-qa/test-results/
          retention-days: 7
